[default]
method = """.map_err(|mut e| {
    use ::escalation::{IntoNewReport, ErrorInfo, Recognize};

    let error_type_name = ::std::any::type_name_of_val(&e);
    let path = $path;
    let fn_name = $fn_name;
    let line = $line as u32;
    let col = $col as u32;
    let expr = ::hooq::source_excerpt_helpers::one_line_stringify!($source);
    let tag = $tag;

    let info = ErrorInfo {
        error_type_name,
        path,
        fn_name,
        line,
        col,
        tag,
        expr,
    };

    e.into_new_report(info, $error)
})"""
bindings = { tag = "\"no_tag\"", error = "None" }
